<!DOCTYPE html>

<head>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(59, 130, 246, 0.6), 0 0 40px rgba(6, 182, 212, 0.4); }

        }
        .chat-item {
            animation: fadeIn 0.3s ease-out forwards;
        }
        /* Custom scrollbar for immersive look */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(59, 130, 246, 0.5);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-[#030712] bg-[radial-gradient(ellipse_80%_80%_at_50%_-20%,rgba(14,165,233,0.15),rgba(255,255,255,0))] text-white min-h-screen flex flex-col items-center justify-between p-4 font-sans selection:bg-blue-500 selection:text-white">

    <!-- Top Header / Live Counter -->

        </div>
        <div class="text-gray-300 flex items-center gap-1.5 font-medium">
            <i class="fa-solid fa-users text-cyan-400"></i>
            <span>Online: <strong id="online-count" class="text-white">1,842</strong></span>
        </div>
    </div>

    <!-- Main Card Container -->
    <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-2xl border border-blue-500/30 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.8)] overflow-hidden flex flex-col items-center p-6 text-center relative">
        
        <!-- Ambient glowing backdrop element -->
        <div class="absolute -top-24 left-1/2 -translate-x-1/2 w-48 h-48 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

        <!-- Logo -->
        <div class="relative mb-4">
            <div class="absolute -inset-1.5 bg-gradient-to-r from-blue-600 via-cyan-500 to-indigo-500 rounded-full blur-md opacity-75 animate-pulse"></div>
            <img src="https://i.ibb.co/zCkQmLg/file-00000000bb4082088830b2ef6fde874.png" alt="VIP Proxy Server Logo" class="relative w-24 h-24 rounded-full object-cover border-2 border-cyan-400/80 shadow-2xl">
        </div>

        <!-- Title & Headline -->
        <h1 class="text-2xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-teal-300 mb-1 drop-shadow-sm">VIP Proxy Server</h1>
        <p class="text-xs text-gray-400 mb-5 flex items-center justify-center gap-1.5 font-medium">
            <i class="fa-solid fa-shield-halved text-cyan-400"></i> Watch Full Video & Unlock Fast Access
        </p>

        <!-- Video Player Box with Unmute Hint Overlay -->
        <div id="video-wrapper" class="w-full aspect-video bg-black rounded-2xl overflow-hidden border border-slate-700/80 shadow-inner mb-6 relative group cursor-pointer">
            <video id="promoVideo" class="w-full h-full object-cover pointer-events-none" autoplay muted loop playsinline>
                <source src="https://videotourl.com/videos/1790194360765-d3d1e187-49e8-46da-acb8-bcd9c7f043b6.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
            
            <!-- Tap to Unmute Overlay Badge -->
            <div id="unmute-badge" class="absolute inset-0 bg-black/40 backdrop-blur-[2px] flex flex-col items-center justify-center transition-opacity duration-300">
                <div class="bg-blue-600/90 hover:bg-blue-500 text-white px-4 py-2 rounded-full text-xs font-bold flex items-center gap-2 shadow-lg border border-blue-400/50">
                    <i class="fa-solid fa-volume-high text-cyan-200 animate-bounce"></i>
                    <span>Tap Anywhere to Unmute Sound</span>
                </div>
            </div>
        </div>

        <!-- CTA Button -->
        <a href="https://jito777.games/landing?ch=114&fbPixel=4475782945967684" target="_blank" class="w-full cta-btn bg-gradient-to-r from-blue-600 via-cyan-500 to-blue-500 hover:from-blue-500 hover:to-cyan-400 text-white font-black py-4 px-6 rounded-2xl shadow-xl transition-all duration-300 transform active:scale-95 flex items-center justify-center gap-3 text-base uppercase tracking-wider border border-cyan-400/30">
            <i class="fa-solid fa-key text-lg text-cyan-200"></i>
            GET PROXY SERVER
        </a>
    </div>

    <!-- Live Recent Activity / Success Feed Ticker -->
    <div class="w-full max-w-md mt-3 bg-slate-900/80 backdrop-blur-xl rounded-2xl border border-slate-800/80 p-3 shadow-lg">
        <div class="text-[11px] text-gray-400 font-bold mb-2 flex items-center justify-between border-b border-slate-800 pb-1.5 uppercase tracking-wider">
            <span><i class="fa-solid fa-bolt text-amber-400 mr-1"></i> Live Success Activity</span>
            <span class="text-emerald-400 flex items-center gap-1 font-semibold"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-ping"></span> Live</span>
        </div>
        <div id="chat-container" class="space-y-2 h-20 overflow-hidden text-left text-xs">
            <!-- Dynamic entries injected via JS -->
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-3 text-[11px] text-gray-500 text-center font-medium">
        &copy; 2026 VIP Proxy Server. Encrypted & Verified Connection.
    </footer>

    <script>
        // Unmute Video on any click / touch on the page
        let isUnmuted = false;
        document.body.addEventListener('click', () => {
            if (!isUnmuted) {
                const video = document.getElementById('promoVideo');
                const badge = document.getElementById('unmute-badge');
                video.muted = false;
                video.volume = 1.0;
                if(badge) badge.style.opacity = '0';
                setTimeout(() => { if(badge) badge.remove(); }, 300);
                isUnmuted = true;
            }
        });

        // Random Online User Count Fluctuation
        setInterval(() => {
            const countElem = document.getElementById('online-count');
            let current = parseInt(countElem.innerText.replace(',', ''));
            let change = Math.floor(Math.random() * 11) - 5; // -5 to +5
            let newCount = Math.max(1450, current + change);
            countElem.innerText = newCount.toLocaleString();
        }, 3000);

        // Live Chat / Feedback Messages Simulation
        const names = ["Rahul_99", "Amit_FF", "Deepak_X", "Sahil_Pro", "Vicky_07", "Rohit_Gamer", "Karan_94", "Ankit_Op", "Sameer_77", "Ajay_VIP"];
        const messages = [
            "Mil gaya bhai, working hai! 🔥",
            "Thanks bro, ek baar mein connect ho gaya.",
            "Amazing speed mil rahi hai proxy se ⚡",
            "Arre bhai ekdum genuine trick hai!",
            "Thanks a lot, working flawlessly.",
            "Got it! Finally working 🔥🔥",
            "Instant proxy mil gayi, thanks!"
        ];

        function addChatMessage() {
            const container = document.getElementById('chat-container');
            const randomName = names[Math.floor(Math.random() * names.length)];
            const randomMsg = messages[Math.floor(Math.random() * messages.length)];
            
            const div = document.createElement('div');
            div.className = "chat-item flex items-center justify-between bg-slate-800/40 px-3 py-1.5 rounded-xl border border-slate-700/40 shadow-sm";
            div.innerHTML = `
                <span class="text-cyan-300 font-semibold">@${randomName}</span>
                <span class="text-gray-300 font-medium">${randomMsg}</span>
            `;

            container.prepend(div);
            if (container.children.length > 3) {
                container.lastChild.remove();
            }
        }

        // Add initial entries
        addChatMessage();
        setTimeout(addChatMessage, 1200);

        // Periodically add new success message
        setInterval(addChatMessage, 3200);
    </script>
</body>
</html>
